[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[project]
name = "iiif-ocr-web"
version = "0.1.0"
description = "Django web application for IIIF OCR"
requires-python = "~=3.13.0"
dependencies = [
  "django~=6.0",
  "django-absurd>=1.0.1",
  "iiif-ocr-core",
  "psycopg[binary]>=3.2",
]

[tool.uv.sources]
iiif-ocr-core = { workspace = true }
