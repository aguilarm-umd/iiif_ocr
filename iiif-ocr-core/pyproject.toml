[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[project]
name = "iiif-ocr-core"
version = "0.1.0"
description = "Reusable IIIF OCR processing logic"
requires-python = "~=3.13.0"
dependencies = [
  "numpy>=2.2.6",
  "paddleocr>=3.3.2",
  "paddlepaddle<3.3.0",
  "pillow~=12.3.0",
  "requests>=2.32.5",
  "yattag>=1.16.1",
]
