[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[project]
name = "iiif-ocr-cli"
version = "0.1.0"
description = "Command-line interface for IIIF OCR"
readme = "../README.md"
requires-python = "~=3.10.0"
dependencies = [
  "click>=8.3.1",
  "iiif-ocr-core",
]

[project.scripts]
iiif_ocr = "iiif_ocr_cli.command:main"

[tool.uv.sources]
iiif-ocr-core = { workspace = true }