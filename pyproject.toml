[tool.uv]
workspace = { members = ["iiif-ocr-core", "iiif-ocr-cli", "iiif-ocr-web"] }

[tool.ruff]
indent-width = 2
line-length = 120
exclude = ["env", ".tox", ".venv"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# for now, using the pre-0.16 default ruleset in ruff
# see https://astral.sh/blog/ruff-v0.16.0#better-default-rule-set
select = ["E4", "E7", "E9", "F"]
